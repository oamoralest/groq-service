[build-system]
requires = ["setuptools>=64.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "groq-service"
version = "0.1.0"
description = "A Python service for interacting with Groq's API"
requires-python = ">=3.9"
dependencies = [
    "groq>=0.1.0",
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
]

[tool.setuptools]
packages = ["groq_service"] 