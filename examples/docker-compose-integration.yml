version: '3.8'

services:
  # Groq Service API
  groq-service:
    build:
      context: ..
      dockerfile: Dockerfile
    image: groq-service:latest
    ports:
      - "8500:8500"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8500/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - groq-network
  
  # Example client application
  example-app:
    build:
      context: ./example-app
      dockerfile: Dockerfile
    image: example-app:latest
    depends_on:
      groq-service:
        condition: service_healthy
    environment:
      - GROQ_SERVICE_URL=http://groq-service:8500
    ports:
      - "8080:8080"
    networks:
      - groq-network

networks:
  groq-network:
    driver: bridge 